<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101310" />
  <meta name="description" content="{{DESCRIPTION}}" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ar_SA" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL}}" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="{{CANONICAL}}" />
  <link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="{{BASE}}site.css" />
  <link rel="stylesheet" href="{{BASE}}assets/catalog.css" />
  <script src="{{BASE}}app.js" type="module"></script>
  <title>{{TITLE}}</title>
</head>
<body>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m6 6-6-6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7 7h10c2 0 3 1 3.5 3l1 7c.3 2-2 3-3.5 1l-2-2H8l-2 2c-1.5 2-3.8 1-3.5-1l1-7C4 8 5 7 7 7Z"/><path d="M7 10v5m-2.5-2.5h5M16 11h.01M18 14h.01"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3L12 3Z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-tool" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></symbol>
  </defs></svg>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="{{BASE}}" aria-label="عالم عبودين، الرئيسية">
        <span class="brand-mark" aria-hidden="true">a<span>f</span><i></i></span>
        <span class="brand-name">عالم عبودين<span lang="en" dir="ltr">ABODEN FUN WORLD</span></span>
      </a>
      <nav class="desktop-nav" aria-label="التنقل الرئيسي">
        <a href="{{BASE}}" {{CURRENT}}>الرئيسية</a>
        <a href="{{BASE}}#library">المكتبة</a>
        <a href="{{BASE}}#about">عن العالم</a>
      </nav>
      <div class="header-actions"><span class="preview-badge"><i></i>معاينة الواجهة</span>
        <a class="icon-button" href="{{BASE}}#search" data-search-link aria-label="ابحث في المكتبة"><svg class="icon"><use href="#i-search"/></svg></a>
        <button class="icon-button menu-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="mobile-nav"><svg class="icon"><use href="#i-menu"/></svg></button>
      </div>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="التنقل للجوال" hidden><a href="{{BASE}}">الرئيسية</a><a href="{{BASE}}#library">المكتبة</a><a href="{{BASE}}#about">عن العالم</a></nav>
  </header>
  <main id="main" tabindex="-1">{{CONTENT}}</main>
  <footer class="site-footer"><div class="shell footer-inner">
    <a class="brand footer-brand" href="{{BASE}}"><span class="brand-mark" aria-hidden="true">a<span>f</span><i></i></span><span class="brand-name">عالم عبودين<span lang="en" dir="ltr">MADE FOR THE FUN OF IT.</span></span></a>
    <span class="copyright">© 2026 عالم عبودين</span>
    <div class="footer-links"><a href="{{BASE}}#about">عن العالم</a><a href="{{BASE}}licenses/">التراخيص</a><a href="#main" aria-label="العودة إلى أعلى الصفحة">للأعلى ↑</a></div>
  </div></footer>
</body>
</html>
