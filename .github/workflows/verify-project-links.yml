name: Verify approved project links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-project-links.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read published pages and original assets
        run: |
          python3 - <<'PY'
          import concurrent.futures,json,pathlib,urllib.request,urllib.parse
          from html.parser import HTMLParser
          out=pathlib.Path('/tmp/project-link-evidence'); out.mkdir()
          class Resources(HTMLParser):
            def __init__(self): super().__init__(); self.urls=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='script' and a.get('src'):self.urls.append(a['src'])
              if tag=='link' and a.get('rel')=='stylesheet':self.urls.append(a['href'])
          def read(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Aboden-catalog-link-verifier'}),timeout=25) as r:return r.status,r.url,r.read()
          names=['Aboden-Hero','AR-Aboden','Motri','BIG-BATTLES','AR-Shooter','Boom','Dahrooj','hajwala','SANDLINE']
          def verify(name):
            url='https://3wasfnjd.github.io/'+name+'/'
            result={'repository':name,'requestedUrl':url,'resources':[]}
            try:
              status,final,data=read(url); result.update(status=status,url=final,bytes=len(data))
              (out/(name+'.html')).write_bytes(data)
              parser=Resources();parser.feed(data.decode('utf8','replace'))
              for path in parser.urls[:12]:
                asset=urllib.parse.urljoin(final,path)
                try:
                  s,u,b=read(asset);result['resources'].append({'url':u,'status':s,'bytes':len(b)})
                except Exception as e:result['resources'].append({'url':asset,'error':str(e)})
            except Exception as e:result['error']=str(e)
            (out/(name+'.json')).write_text(json.dumps(result,indent=2))
            print(json.dumps(result))
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:list(pool.map(verify,names))
          assets={'hajwala-screenshot.png':'hajwala/master/screenshot.png','Motri-home.webp':'Motri/main/static/ui/previews/home.webp','Dahrooj-three.js':'Dahrooj/main/vendor/three/three-r128.min.js'}
          assets.update({'big-'+str(r)+str(c)+'.webp':'BIG-BATTLES/main/assets/poster/big-battles-'+str(r)+str(c)+'.webp' for r in range(4) for c in range(2)})
          for name,path in assets.items():
            s,u,b=read('https://raw.githubusercontent.com/3wasfnjd/'+path); (out/name).write_bytes(b)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-link-evidence
          path: /tmp/project-link-evidence
          retention-days: 3
